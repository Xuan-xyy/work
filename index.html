<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>秋招 × 实习成长工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232383E2'/%3E%3Cpath d='M9 20.5 14 15l3.2 3.2L23 11.5' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/app.css" />
<link rel="stylesheet" href="assets/css/views.css" />
<script>
  /* 主题引导：尽早写入，避免首屏闪白 */
  (function () {
    try {
      var raw = localStorage.getItem('qiuzhao.workbench.v1');
      var t = raw ? (JSON.parse(raw).settings || {}).theme : 'light';
      if (t === 'system' || !t) {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="主导航"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>

  <div class="overlay-root" id="overlay-root"></div>
  <div class="toast-root" id="toast-root" aria-live="polite"></div>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/views/dashboard.js"></script>
  <script src="assets/js/views/applications.js"></script>
  <script src="assets/js/views/soon.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
